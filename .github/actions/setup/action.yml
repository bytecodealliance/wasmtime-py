name: 'Setup wasmtime-py CI'
inputs:
  python-version:
    description: 'Version of Python to configure'
    required: false
    default: '3'
runs:
  using: "composite"
  steps:
  # Install uv and configure it to use the requested Python version. This sets
  # `UV_PYTHON` for later steps, and uv will download a managed Python if the
  # runner doesn't already have a matching one installed.
  - name: Install uv
    uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
    with:
      python-version: ${{ inputs.python-version }}

  - name: Show python in-use
    shell: bash
    run: uv run python --version

  # Download precompiled wasmtime binaries for running the project
  - run: uv run ci/download-wasmtime.py
    shell: bash
